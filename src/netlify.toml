[[headers]]
  for = "/*"
  [headers.values]
    Report-To = '''{"group":"default","max_age":31536000,"endpoints":[{"url":"https://gsferreira.report-uri.com/a/d/g"}],"include_subdomains":true}'''
    NEL = '''{"report_to":"default","max_age":31536000,"include_subdomains":true}'''


[[redirects]]
  from = "/rss.xml"
  to = "/feed.xml"
  status = 301
  force = true
# ---------------------------------------------------------------------------
# Workshops moved to Black Lab Studios.
#
# BLS is canonical for descriptions, curriculum and booking. The source pages
# are deleted from src/, so /workshops/ is now a calendar that points out.
#
# Explicit rules only. No /workshops/* splat: it would swallow /workshops/
# itself and anything added here later. Rules match top-down, first wins.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/workshops/build-your-first-ai-agent-in-net/"
  to = "https://blacklabstudios.com/workshops/build-your-first-ai-agent-in-dotnet/"
