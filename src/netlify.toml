[[headers]]
  for = "/*"
  [headers.values]
    Report-To = '''{"group":"default","max_age":31536000,"endpoints":[{"url":"https://gsferreira.report-uri.com/a/d/g"}],"include_subdomains":true}'''
    NEL = '''{"report_to":"default","max_age":31536000,"include_subdomains":true}'''


[[redirects]]
  from = "/rss.xml"
  to = "/feed.xml"
  status = 301
  force = true
# ---------------------------------------------------------------------------
# The workshop pages live here again.
#
# They were handed to Black Lab Studios in Aug 2026 and 301'd away. That split
# has been reversed: guiferreira.me carries the outlines and the public dates,
# because those sell a seat to a person. Black Lab Studios keeps private and
# team bookings, because those sell an engagement to a company.
#
# The cohort is the exception. It is a course with its own site and its own
# checkout, not a workshop that gets run for a team, so it keeps redirecting.
#
# Explicit rules only. No /workshops/* splat: it would swallow the real pages.
# Rules match top-down, first wins.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/workshops/build-a-full-stack-ai-app-with-dotnet-cohort/"
  to = "https://www.aipowereddotnet.school/"
  status = 301
  force = true
